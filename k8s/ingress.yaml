apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-java-app
  namespace: quest
spec:
  ingressClassName: nginx
  rules:
    - host: quest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-java-app
                port:
                  number: 80
